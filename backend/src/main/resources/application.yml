server:
  port: 8080

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: none
    open-in-view: false
    entities:
      parent: com.house.model
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/house_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.house.model
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

app:
  crypto:
    secret: ${CRYPTO_SECRET:ChangeThisSecretForProd123}
    algorithm: AES/GCM/NoPadding
  file:
    upload-dir: ${UPLOAD_DIR:./src/main/resources/imgs}
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-size: 10485760
  security:
    jwt:
      secret: ${JWT_SECRET:your-secret-key-at-least-256-bits}
      expiration: 86400000
      header: Authorization
      prefix: Bearer
  snapshot:
    undo-window-minutes: ${SNAPSHOT_UNDO_WINDOW_MINUTES:30}
    history-retention-days: ${SNAPSHOT_HISTORY_RETENTION_DAYS:30}
    cleanup-cron: ${SNAPSHOT_CLEANUP_CRON:0 0 */6 * * *}
  qr:
    base-url: ${QR_BASE_URL:http://localhost:5173}