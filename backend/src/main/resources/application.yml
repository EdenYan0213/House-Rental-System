server:
  port: ${SERVER_PORT:8081}

spring:
  ai:
    openai:
      chat:
        enabled: false
      embedding:
        enabled: false
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      moderation:
        enabled: false
      api-key: ${SPRING_AI_OPENAI_API_KEY:${AI_PRIMARY_API_KEY:${AI_SILICONFLOW_API_KEY:dummy-key}}}
      speech:
        api-key: ${SPRING_AI_OPENAI_SPEECH_API_KEY:${SPRING_AI_OPENAI_API_KEY:${AI_PRIMARY_API_KEY:${AI_SILICONFLOW_API_KEY:dummy-key}}}}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: none
    open-in-view: false
    entities:
      parent: com.house.model
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/house_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.house.model
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

app:
  crypto:
    secret: ${CRYPTO_SECRET:ChangeThisSecretForProd123}
    algorithm: AES/GCM/NoPadding
  file:
    upload-dir: ${UPLOAD_DIR:./src/main/resources/imgs}
    allowed-extensions: jpg,jpeg,png,gif,webp
    max-size: 10485760
  security:
    jwt:
      secret: ${JWT_SECRET:your-secret-key-at-least-256-bits}
      expiration: 86400000
      header: Authorization
      prefix: Bearer
  admin:
    # 首次启动播种 admin 的初始密码。生产环境必须设置 ADMIN_INIT_PASSWORD，
    # 留空则用开发默认值并打印告警日志。
    init-password: ${ADMIN_INIT_PASSWORD:}
  snapshot:
    undo-window-minutes: ${SNAPSHOT_UNDO_WINDOW_MINUTES:30}
    history-retention-days: ${SNAPSHOT_HISTORY_RETENTION_DAYS:30}
    cleanup-cron: ${SNAPSHOT_CLEANUP_CRON:0 0 */6 * * *}
  qr:
    base-url: ${QR_BASE_URL:http://localhost:5173}
  billing:
    # 账单应缴宽限天数：账期起始日 + N 天 = 应缴截止日
    grace-days: ${BILLING_GRACE_DAYS:5}
  backup:
    storage-path: ${BACKUP_STORAGE_PATH:./backups}
    # 命令行工具路径，留默认值则从 PATH 查找
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
    mysql-path: ${MYSQL_PATH:mysql}
  complaint:
    require-confirm: ${COMPLAINT_REQUIRE_CONFIRM:true}
  ai-assistant:
    default-model: ${AI_DEFAULT_MODEL:primary}
    max-retries: ${AI_MAX_RETRIES:2}
    sms-overdue-template: ${AI_SMS_OVERDUE_TEMPLATE:尊敬的{租户姓名}，您房间{房间号}有{逾期笔数}笔账单逾期，总欠费{总欠费金额}元，请尽快登录系统支付。}
    fallback-message: ${AI_FALLBACK_MESSAGE:抱歉，未能理解您的指令，请重新描述。您可以说"今天101房间水表1250.5，电表3680"或"给张三发账单短信"。}
    providers:
      - name: primary
        base-url: ${AI_PRIMARY_BASE_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        api-key: ${AI_PRIMARY_API_KEY:}
        model: ${AI_PRIMARY_MODEL:GLM-4.7-flash}
        temperature: ${AI_PRIMARY_TEMPERATURE:0}
        timeout-millis: ${AI_PRIMARY_TIMEOUT_MS:2500}
      - name: siliconflow
        base-url: ${AI_SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
        # 密钥只从环境变量读取，不要写死进仓库
        api-key: ${AI_SILICONFLOW_API_KEY:}
        model: ${AI_SILICONFLOW_MODEL:Qwen/Qwen3-8B}
        temperature: ${AI_SILICONFLOW_TEMPERATURE:0}
        timeout-millis: ${AI_SILICONFLOW_TIMEOUT_MS:4000}
      - name: backup
        base-url: ${AI_BACKUP_BASE_URL:https://api.openai.com}
        api-key: ${AI_BACKUP_API_KEY:}
        model: ${AI_BACKUP_MODEL:gpt-4o-mini}
        temperature: ${AI_BACKUP_TEMPERATURE:0}
        timeout-millis: ${AI_BACKUP_TIMEOUT_MS:2500}
